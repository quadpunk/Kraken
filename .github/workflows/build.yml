name: Build kr@ken

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ARTEFACTS: build/Kraken_artefacts/Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - name: macOS
            os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          - name: Linux
            os: ubuntu-latest
            cmake_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} "${{ matrix.cmake_args }}"

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      # macOS: zippa med ditto så att bundle-rättigheter bevaras
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "${{ env.ARTEFACTS }}/VST3/kr@ken.vst3" dist/kr-at-ken-VST3-macOS.zip
          ditto -c -k --keepParent "${{ env.ARTEFACTS }}/Standalone/kr@ken.app" dist/kr-at-ken-Standalone-macOS.zip

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: kr-at-ken-${{ runner.os }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload (Windows / Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: kr-at-ken-${{ runner.os }}
          path: |
            ${{ env.ARTEFACTS }}/VST3
            ${{ env.ARTEFACTS }}/Standalone
          if-no-files-found: error

  # Skapar en GitHub Release när du pushar en tagg, t.ex. v0.1.0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip per OS
        run: |
          cd artifacts
          for d in */; do
            d=${d%/}
            (cd "$d" && zip -r "../${d}.zip" .)
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
